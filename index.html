<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive Spreadsheet Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS for parsing .xlsx / Google Sheets -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Spreadsheet Viewer</h1>
        <p id="status" class="text-sm text-slate-400 mt-1">Fetching latest data from Google Drive...</p>
      </div>
      <div class="flex items-center gap-3">
        <input
          id="searchInput"
          type="text"
          placeholder="Filter rows..."
          class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
        />
        <button
          onclick="loadSheet()"
          class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition"
        >
          Refresh
        </button>
      </div>
    </header>

    <!-- Sheet Tabs -->
    <div id="tabs" class="flex flex-wrap gap-2"></div>

    <!-- Table Container -->
    <div class="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900/60 shadow-lg">
      <table id="dataTable" class="w-full text-left border-collapse text-sm">
        <thead id="tableHead" class="bg-slate-900 text-slate-300 uppercase text-xs tracking-wider border-b border-slate-800"></thead>
        <tbody id="tableBody" class="divide-y divide-slate-800/70"></tbody>
      </table>
    </div>
  </div>

  <script>
    // 1. PASTE YOUR GOOGLE SHEET / DRIVE FILE ID HERE
    const FILE_ID = "YOUR_FILE_ID_HERE";

    // Use the Google Sheets XLSX export URL (reliable CORS support)
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/16JzeEoMVnPeHJaUcEtxKHCx4Wris4Ki_/edit?usp=sharing&ouid=114687182696636671247&rtpof=true&sd=true`;

    let workbook = null;
    let currentRows = [];

    async function loadSheet() {
      const statusEl = document.getElementById("status");
      statusEl.textContent = "Fetching latest data...";

      try {
        // Cache-busting query param ensures GitHub Pages always pulls fresh edits
        const response = await fetch(`${SHEET_URL}&t=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status} — check sharing permissions.`);

        const arrayBuffer = await response.arrayBuffer();
        workbook = XLSX.read(arrayBuffer, { type: "array" });

        renderTabs(workbook.SheetNames);
        renderSheet(workbook.SheetNames[0]);
        statusEl.textContent = `Last synced: ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        console.error(err);
        statusEl.innerHTML = `<span class="text-rose-400">Error: ${err.message} Make sure the file is saved as a Google Sheet and shared as "Anyone with the link".</span>`;
      }
    }

    function renderTabs(sheetNames) {
      const tabsEl = document.getElementById("tabs");
      tabsEl.innerHTML = "";
      if (sheetNames.length <= 1) return;

      sheetNames.forEach((name, idx) => {
        const btn = document.createElement("button");
        btn.textContent = name;
        btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition ${
          idx === 0 ? "bg-emerald-600 text-white" : "bg-slate-800 text-slate-300 hover:bg-slate-700"
        }`;
        btn.onclick = () => {
          document.querySelectorAll("#tabs button").forEach(b => {
            b.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
          });
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 text-white transition";
          renderSheet(name);
        };
        tabsEl.appendChild(btn);
      });
    }

    function renderSheet(sheetName) {
      const worksheet = workbook.Sheets[sheetName];
      // Convert sheet to 2D array (header: 1 preserves exact column order)
      currentRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
      drawTable(currentRows);
    }

    function drawTable(rows) {
      const thead = document.getElementById("tableHead");
      const tbody = document.getElementById("tableBody");
      thead.innerHTML = "";
      tbody.innerHTML = "";

      if (!rows || rows.length === 0) {
        tbody.innerHTML = `<tr><td class="p-4 text-slate-500">No data found in this sheet.</td></tr>`;
        return;
      }

      // Render Header (Row 0)
      const headerRow = document.createElement("tr");
      rows[0].forEach(col => {
        const th = document.createElement("th");
        th.className = "px-4 py-3 font-semibold";
        th.textContent = col;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      // Render Body (Rows 1+)
      rows.slice(1).forEach(row => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-800/40 transition";
        rows[0].forEach((_, colIdx) => {
          const td = document.createElement("td");
          td.className = "px-4 py-2.5 text-slate-300 whitespace-nowrap";
          td.textContent = row[colIdx] ?? "";
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    // Live Search Filter
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase();
      if (!currentRows.length) return;
      const filtered = [
        currentRows[0],
        ...currentRows.slice(1).filter(row =>
          row.some(cell => String(cell).toLowerCase().includes(term))
        )
      ];
      drawTable(filtered);
    });

    loadSheet();
  </script>
</body>
</html>
